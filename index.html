<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAGE | Novelas que cobran vida</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#0B0B10;--panel:#15151D;--pink:#E63967;--violet:#7B61FF;--gold:#F5C451;
  --text:#F5F5F7;--muted:#A6A6B3;--success:#55D68A;--error:#FF5364;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.app{min-height:100vh}.hidden{display:none!important}
.nav{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #24242e;background:#0b0b10ee;backdrop-filter:blur(14px);position:sticky;top:0;z-index:20;gap:14px}
.logo{font:800 34px 'Barlow Condensed';letter-spacing:4px}.logo span{color:var(--pink)}
.navlinks{display:flex;gap:10px;align-items:center}.nav button,.ghost{background:transparent;color:var(--muted);border:0;padding:10px 14px}.nav button:hover{color:white}
.btn{border:0;padding:13px 19px;border-radius:10px;font-weight:700;color:white;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 8px 30px #7b61ff22}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#24242e}.btn.gold{background:var(--gold);color:#17120a}.btn.small{padding:9px 13px;font-size:13px}
.container{width:min(1180px,90%);margin:auto}.hero{min-height:620px;display:grid;place-items:center;position:relative;overflow:hidden;background:
radial-gradient(circle at 70% 35%,#7b61ff33,transparent 30%),radial-gradient(circle at 30% 60%,#e6396725,transparent 28%)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0b10 0%,#0b0b10aa 45%,transparent 100%)}
.hero-content{position:relative;z-index:2;width:min(650px,90%);margin-left:0}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:12px}
h1,h2,h3{font-family:'Barlow Condensed';margin:0}h1{font-size:clamp(62px,9vw,110px);line-height:.85;letter-spacing:3px}h2{font-size:42px}h3{font-size:25px}
.hero p{font-size:18px;color:#c9c9d2;line-height:1.6;max-width:580px}.actions{display:flex;gap:12px;flex-wrap:wrap}
.section{padding:55px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid #292936;border-radius:15px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:#4a4a5a}
.cover{height:235px;display:flex;align-items:end;padding:18px;position:relative;overflow:hidden;background:#0d0d13}
.cover svg,.large-cover svg,.scene-art svg,.end-illustration svg{position:absolute;inset:0;width:100%;height:100%}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c 0%,transparent 55%)}
.cover span{position:relative;z-index:1;font:800 32px 'Barlow Condensed';letter-spacing:2px;text-shadow:0 4px 20px #000}
.card-body{padding:17px}.meta{color:var(--muted);font-size:13px;margin:6px 0}.desc{color:#bdbdc8;font-size:14px;line-height:1.5}
.badge{display:inline-block;border:1px solid #454554;border-radius:99px;padding:5px 9px;color:#ddd;font-size:11px;margin:4px 4px 0 0}
.badge.pink{border-color:#e6396788;color:#ff7998}.badge.green{border-color:#55d68a77;color:var(--success)}.badge.gold{border-color:#f5c45177;color:var(--gold)}
.cloudbadge{font-size:11px;padding:5px 10px;border-radius:99px;border:1px solid #383846;color:var(--muted);display:flex;align-items:center;gap:6px}
.cloudbadge.on{color:var(--success);border-color:#55d68a55}.cloudbadge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.screen{min-height:calc(100vh - 72px)}.auth{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:40px}
.form{width:min(450px,100%);background:var(--panel);border:1px solid #2b2b37;border-radius:18px;padding:30px}.form h2{margin-bottom:8px}.form p{color:var(--muted)}
label{display:block;font-size:13px;margin:17px 0 7px;color:#ddd}input{width:100%;padding:13px 14px;background:#0d0d13;border:1px solid #30303c;color:white;border-radius:9px;outline:none}input:focus{border-color:var(--violet)}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin:16px 0}.check input{width:auto}.error{color:var(--error);font-size:13px;margin-top:8px}
.library{padding:35px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:220px}.filter{padding:11px 14px;background:var(--panel);border:1px solid #30303c;color:white;border-radius:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 20px}.chip{padding:7px 13px;border-radius:99px;border:1px solid #33333f;color:var(--muted);font-size:12px;background:transparent}.chip.active{background:linear-gradient(135deg,var(--pink),var(--violet));color:white;border-color:transparent}
.detail{padding:55px 0}.detail-top{display:grid;grid-template-columns:330px 1fr;gap:35px;align-items:center}.large-cover{height:450px;border-radius:18px;overflow:hidden;position:relative;display:flex;align-items:end;justify-content:center;box-shadow:0 30px 80px #0008;text-align:center;padding:20px;background:#0d0d13}
.large-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000b 0%,transparent 55%)}
.large-cover span{position:relative;z-index:1;font:800 46px 'Barlow Condensed';letter-spacing:3px;text-shadow:0 4px 20px #000}
.chapters{margin-top:45px;display:grid;gap:10px}.chapter{background:var(--panel);padding:15px;border:1px solid #292936;border-radius:12px;display:flex;align-items:center;justify-content:space-between}
.reader{min-height:100vh;position:relative;overflow:hidden;transition:background 1s}
.reader.mood-noche{background:radial-gradient(circle at 70% 20%,#7b61ff33,transparent 25%),linear-gradient(160deg,#101018,#09090d)}
.reader.mood-misterio{background:radial-gradient(circle at 60% 15%,#e6396722,transparent 25%),linear-gradient(160deg,#0d0d14,#08080c)}
.reader.mood-esperanza{background:radial-gradient(circle at 60% 15%,#55d68a2a,transparent 30%),linear-gradient(160deg,#0e1512,#090c0b)}
.reader.mood-peligro{background:radial-gradient(circle at 60% 15%,#ff536433,transparent 28%),linear-gradient(160deg,#160a0d,#0a0708)}
.reader.mood-romance{background:radial-gradient(circle at 60% 15%,#e6396733,transparent 28%),linear-gradient(160deg,#150e14,#0a080a)}
.reader.mood-fantasia{background:radial-gradient(circle at 60% 15%,#7b61ff33,transparent 28%),linear-gradient(160deg,#100d18,#08070c)}
.reader.mood-magia{background:radial-gradient(circle at 60% 15%,#f5c45130,transparent 28%),linear-gradient(160deg,#151109,#0a0806)}
.reader.mood-neutral{background:radial-gradient(circle at 60% 15%,#a6a6b322,transparent 28%),linear-gradient(160deg,#101014,#09090b)}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particles i{position:absolute;bottom:-10%;border-radius:50%;opacity:.5;animation:float 8s linear infinite}
@keyframes float{to{transform:translateY(-120vh)}}
.scene-art{height:56vh;display:grid;place-items:center;position:relative}
.scene-icon{width:120px;height:120px;opacity:.85;filter:drop-shadow(0 10px 30px #0007)}
.character{position:absolute;bottom:3%;font:800 110px 'Barlow Condensed';letter-spacing:5px;text-shadow:0 10px 40px #000;transition:.3s}
.character.left{left:14%;color:#ff9ab0}.character.right{right:14%;color:#a99cff}.character.dim{opacity:.25}
.dialogue{position:absolute;left:5%;right:5%;bottom:4%;background:#11111aee;border:1px solid #414151;border-radius:15px;padding:20px 24px;backdrop-filter:blur(10px);cursor:pointer}
.speaker{color:var(--pink);font-weight:800;margin-bottom:8px}.dialogue-text{font-size:18px;line-height:1.55;min-height:55px}.reader-controls{position:absolute;top:20px;left:5%;right:5%;display:flex;justify-content:space-between;z-index:3}.progress{height:4px;background:#2b2b35;position:absolute;top:0;left:0;right:0;z-index:4}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet));transition:width .4s}
.choices{position:absolute;inset:0;background:#0b0b10dd;display:grid;place-items:center;z-index:5;padding:30px}.choice-box{width:min(680px,100%);text-align:center}.choice-box p{color:#ccc;font-size:18px}.choice{width:100%;padding:16px;margin:7px 0;border:1px solid #484856;background:#171720;color:white;border-radius:11px;text-align:left}.choice:hover{border-color:var(--pink);background:#22131a}
.end{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px;position:relative;overflow:hidden;background:#0a0a0e}
.end-illustration{position:absolute;inset:0;opacity:.55}
.end-illustration:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#0a0a0e33,#0a0a0ed9 75%)}
.end-card{position:relative;z-index:1;width:min(650px,100%)}.end-symbol{font-size:80px;margin-bottom:15px}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}.stat{background:var(--panel);border:1px solid #2d2d38;padding:13px 18px;border-radius:10px}
.profile{padding:50px 0}.profile-head{display:flex;gap:20px;align-items:center;background:var(--panel);padding:25px;border-radius:16px;border:1px solid #2b2b37;flex-wrap:wrap}.avatar{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet));font:700 28px 'Barlow Condensed'}
.progressbar{height:6px;background:#26262f;border-radius:99px;overflow:hidden;margin:6px 0}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet))}
.endings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ending-tile{background:var(--panel);border:1px solid #292936;border-radius:12px;padding:14px;text-align:center}.ending-tile.locked{opacity:.35}.ending-tile .es{font-size:26px;margin-bottom:6px}
footer{border-top:1px solid #22222b;color:var(--muted);padding:25px 0;margin-top:30px;font-size:13px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #33333f;border-top-color:var(--pink);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loadscreen{min-height:100vh;display:grid;place-items:center;gap:14px;color:var(--muted)}
@media(max-width:750px){.detail-top{grid-template-columns:1fr}.large-cover{height:260px}.navlinks button:not(.btn){display:none}.character{font-size:70px}.scene-art{height:48vh}.dialogue{bottom:2%;left:3%;right:3%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   KAGE — Configuración de backend en la nube (Firebase)
   Para activar el guardado real en la nube:
   1. Crea un proyecto gratis en https://console.firebase.google.com
   2. Activa "Authentication" (método Correo/contraseña) y "Firestore Database".
   3. Copia tus credenciales del proyecto y pégalas abajo, reemplazando los valores de ejemplo.
   Si dejas los valores de ejemplo tal cual, KAGE funciona igual pero guarda
   los datos SOLO en este navegador (modo local), como red de seguridad.
============================================================ */
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "000000000000",
  appId: "TU_APP_ID"
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("TU_") !== 0;

/* ================== Capa de almacenamiento (nube o local) ================== */
const LocalBackend = {
  mode:"local",
  async init(){ return true },
  _users(){ return JSON.parse(localStorage.getItem('kage_users')||'{}') },
  _saveUsers(u){ localStorage.setItem('kage_users', JSON.stringify(u)) },
  async signUp(name,email,password){
    let users=this._users();
    if(users[email]) throw new Error('Ya existe una cuenta con este correo.');
    let uid='local_'+Date.now();
    users[email]={name,email,password,uid};
    this._saveUsers(users);
    localStorage.setItem('kage_session', uid);
    await this.saveProgress(uid,{favorites:[],library:{}});
    return {uid,name,email};
  },
  async signIn(email,password){
    let users=this._users();
    let u=users[email];
    if(!u||u.password!==password) throw new Error('Correo o contraseña incorrectos.');
    localStorage.setItem('kage_session', u.uid);
    return {uid:u.uid,name:u.name,email:u.email};
  },
  async signOut(){ localStorage.removeItem('kage_session') },
  async currentUser(){
    let uid=localStorage.getItem('kage_session');
    if(!uid) return null;
    let users=this._users();
    let entry=Object.values(users).find(u=>u.uid===uid);
    return entry?{uid,name:entry.name,email:entry.email}:null;
  },
  async saveProgress(uid,data){ localStorage.setItem('kage_progress_'+uid, JSON.stringify(data)) },
  async loadProgress(uid){ return JSON.parse(localStorage.getItem('kage_progress_'+uid)||'{"favorites":[],"library":{}}') }
};

const FirebaseBackend = {
  mode:"cloud", _app:null,_auth:null,_db:null,_fns:null,
  async init(){
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    this._app = appMod.initializeApp(firebaseConfig);
    this._auth = authMod.getAuth(this._app);
    this._db = fsMod.getFirestore(this._app);
    this._fns = {...authMod, ...fsMod};
    return true;
  },
  async signUp(name,email,password){
    const f=this._fns;
    const cred = await f.createUserWithEmailAndPassword(this._auth,email,password);
    await f.updateProfile(cred.user,{displayName:name});
    await f.setDoc(f.doc(this._db,'users',cred.user.uid),{favorites:[],library:{}});
    return {uid:cred.user.uid,name,email};
  },
  async signIn(email,password){
    const f=this._fns;
    const cred = await f.signInWithEmailAndPassword(this._auth,email,password);
    return {uid:cred.user.uid,name:cred.user.displayName||'Lector KAGE',email:cred.user.email};
  },
  async signOut(){ await this._fns.signOut(this._auth) },
  async currentUser(){
    const f=this._fns;
    return new Promise(res=>{
      const unsub=f.onAuthStateChanged(this._auth,u=>{
        unsub();
        res(u?{uid:u.uid,name:u.displayName||'Lector KAGE',email:u.email}:null);
      });
    });
  },
  async saveProgress(uid,data){ await this._fns.setDoc(this._fns.doc(this._db,'users',uid),data,{merge:true}) },
  async loadProgress(uid){
    const f=this._fns;
    const snap = await f.getDoc(f.doc(this._db,'users',uid));
    return snap.exists()?snap.data():{favorites:[],library:{}};
  }
};

let Backend = LocalBackend;

/* ================== Datos: historias con rutas ramificadas ================== */
const moodIcons={
  noche:'🌙',misterio:'🌫️',esperanza:'✨',peligro:'🔥',romance:'🌸',fantasia:'🔮',magia:'👑',neutral:'⚙️'
};
const moodColor={noche:'#a99cff',misterio:'#9a9aab',esperanza:'#55D68A',peligro:'#FF5364',romance:'#E63967',fantasia:'#7B61FF',magia:'#F5C451',neutral:'#A6A6B3'};

/* ================== Ilustraciones vectoriales originales (SVG) ================== */
let _uid=0; function uid(p){ return p+(_uid++) }
function tint(color,id){ return `<rect x="0" y="0" width="400" height="260" fill="url(#${id})"></rect>` }
function tintDefs(id,color,op){ return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="${op}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>` }

function artStation({train='none',color=moodColor.noche}={}){
 let g1=uid('sg'),g2=uid('tg');
 return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="${g1}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141420"/><stop offset="1" stop-color="#0a0a0f"/></linearGradient>${tintDefs(g2,color,.35)}</defs>
 <rect width="400" height="260" fill="url(#${g1})"/>
 <circle cx="320" cy="55" r="26" fill="#f5f0e0" opacity=".85"/><circle cx="320" cy="55" r="40" fill="#f5f0e0" opacity=".12"/>
 <ellipse cx="120" cy="90" rx="90" ry="18" fill="#cfd0e6" opacity=".08"/><ellipse cx="260" cy="130" rx="120" ry="22" fill="#cfd0e6" opacity=".06"/>
 <rect x="0" y="190" width="400" height="14" fill="#1c1c28"/>
 ${[40,110,180,250,320].map(x=>`<line x1="${x}" y1="204" x2="${x}" y2="260" stroke="#26262f" stroke-width="10"/>`).join('')}
 <line x1="0" y1="196" x2="400" y2="196" stroke="#3a3a46" stroke-width="3"/><line x1="0" y1="200" x2="400" y2="200" stroke="#3a3a46" stroke-width="3"/>
 <rect x="0" y="150" width="400" height="42" fill="#181822"/>
 ${[30,370].map(x=>`<rect x="${x-3}" y="100" width="6" height="90" fill="#2c2c38"/><circle cx="${x}" cy="96" r="10" fill="#f5c451" opacity=".9"/><circle cx="${x}" cy="96" r="22" fill="#f5c451" opacity=".18"/>`).join('')}
 ${train==='near'?`<g><rect x="130" y="120" width="150" height="60" rx="10" fill="#20202c"/><rect x="140" y="132" width="26" height="22" rx="3" fill="#F5C451" opacity=".8"/><rect x="176" y="132" width="26" height="22" rx="3" fill="#F5C451" opacity=".8"/><rect x="212" y="132" width="26" height="22" rx="3" fill="#F5C451" opacity=".8"/><circle cx="150" cy="182" r="10" fill="#111"/><circle cx="260" cy="182" r="10" fill="#111"/></g>`:''}
 ${train==='far'?`<g opacity=".8"><circle cx="345" cy="150" r="5" fill="#F5C451"/><circle cx="345" cy="150" r="12" fill="#F5C451" opacity=".3"/></g>`:''}
 ${tint(g2,color)}
 </svg>`}

function artTrainInterior({exit=false,color=moodColor.esperanza}={}){
 let g1=uid('ig'),g2=uid('tg');
 return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="${g1}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181822"/><stop offset="1" stop-color="#0c0c12"/></linearGradient>${tintDefs(g2,color,.3)}</defs>
 <rect width="400" height="260" fill="url(#${g1})"/>
 <ellipse cx="200" cy="0" rx="260" ry="60" fill="#fff" opacity=".05"/>
 ${[40,110,290,360].map((x,i)=>`<rect x="${x-28}" y="70" width="56" height="70" rx="10" fill="${i%2?'#0c0c14':'#10101a'}" stroke="#2c2c3a" stroke-width="2"/>`).join('')}
 ${[75,150,225,300].map(x=>`<rect x="${x-16}" y="170" width="32" height="30" rx="4" fill="#181822"/>`).join('')}
 <rect x="170" y="10" width="60" height="230" fill="${exit?'#F5C451':'#1c1c28'}" opacity="${exit?'.5':'1'}"/>
 ${exit?`<line x1="200" y1="0" x2="200" y2="260" stroke="#F5C451" stroke-width="2" opacity=".6"/><circle cx="200" cy="120" r="60" fill="#F5C451" opacity=".18"/>`:''}
 ${tint(g2,color)}
 </svg>`}

function artTunnelDoor({open=false,color=moodColor.misterio}={}){
 let g1=uid('ug'),g2=uid('tg'),g3=uid('dg');
 return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
 <defs><radialGradient id="${g1}" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#1c1c2a"/><stop offset="1" stop-color="#08080c"/></radialGradient>${tintDefs(g2,color,.35)}<radialGradient id="${g3}" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="${open?'#F5C451':'#2a2a35'}" stop-opacity="${open?.8:.4}"/><stop offset="1" stop-color="${open?'#F5C451':'#2a2a35'}" stop-opacity="0"/></radialGradient></defs>
 <rect width="400" height="260" fill="url(#${g1})"/>
 ${[170,130,95,65].map((r,i)=>`<ellipse cx="200" cy="150" rx="${r+40}" ry="${r+10}" fill="none" stroke="#2c2c3a" stroke-width="2" opacity="${.5-i*.08}"/>`).join('')}
 <rect x="176" y="120" width="48" height="80" rx="4" fill="${open?'#3a3020':'#151520'}" stroke="#4a4a58" stroke-width="2"/>
 <circle cx="200" cy="150" r="70" fill="url(#${g3})"/>
 ${tint(g2,color)}
 </svg>`}

function artFestival({close=false,color=moodColor.romance}={}){
 let g1=uid('fg'),g2=uid('tg');
 return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="${g1}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15101a"/><stop offset="1" stop-color="#0a0810"/></linearGradient>${tintDefs(g2,color,.35)}</defs>
 <rect width="400" height="260" fill="url(#${g1})"/>
 ${Array.from({length:16},(_,i)=>`<circle cx="${(i*37)%400}" cy="${20+((i*53)%40)}" r="1.6" fill="#fff" opacity=".6"/>`).join('')}

async function submitAuth(e,type){
 e.preventDefault();
 let email=document.getElementById('email').value, pass=document.getElementById('pass').value;
 if(type==='register'&&pass!==document.getElementById('confirm').value){state.authError='Las contraseñas no coinciden.';render();return}
 state.authBusy=true;state.authError='';render();
 try{
  let profile = type==='register'? await Backend.signUp(document.getElementById('name').value,email,pass) : await Backend.signIn(email,pass);
  state.user=profile;
  let data=await Backend.loadProgress(profile.uid);
  state.favorites=data.favorites||[]; state.library=data.library||{};
  state.authBusy=false;
  go('library');
 }catch(err){ state.authBusy=false; state.authError=err.message||'Ocurrió un error, intenta de nuevo.'; render(); }
}

 let genres=['Todos',...new Set(stories.map(s=>s.genre))];
 let themes=['Todas',...new Set(stories.flatMap(s=>s.theme))];
 let ages=['Todas',...new Set(stories.map(s=>s.age))];
 let arr=stories.filter(s=> (!q || (s.title+s.genre+s.theme.join(' ')+s.desc).toLowerCase().includes(q))
   && (state.genre==='Todos'||s.genre===state.genre)
   && (state.theme==='Todas'||s.theme.includes(state.theme))
   && (state.age==='Todas'||s.age===state.age));
 if(state.sort==='popularidad') arr=arr.sort((a,b)=>b.popularity-a.popularity);
 else if(state.sort==='alfabetico') arr=arr.sort((a,b)=>a.title.localeCompare(b.title));
 let continuing = Object.keys(state.library).map(id=>stories.find(s=>s.id==id)).filter(Boolean);
 return `${nav()}<main class="library screen container"><div class="eyebrow">DESCUBRE TU PRÓXIMA RUTA</div><h2>Biblioteca</h2>
 <div class="toolbar"><input class="search" value="${state.query}" oninput="state.query=this.value;render()" placeholder="Buscar por título, género, temática...">
 <select class="filter" onchange="state.age=this.value;render()">${ages.map(a=>`<option ${state.age===a?'selected':''}>${a==='Todas'?'Edad recomendada':a}</option>`).join('')}</select>
 <select class="filter" onchange="state.sort=this.value;render()"><option value="popularidad" ${state.sort==='popularidad'?'selected':''}>Más populares</option><option value="alfabetico" ${state.sort==='alfabetico'?'selected':''}>Alfabético</option></select></div>
 <div class="chips">${genres.map(g=>`<button class="chip ${state.genre===g?'active':''}" onclick="toggleGenre('${g}')">${g}</button>`).join('')}</div>
 <div class="chips">${themes.map(t=>`<button class="chip ${state.theme===t?'active':''}" onclick="toggleTheme('${t}')">#${t}</button>`).join('')}</div>
 ${continuing.length?`<section class="section" style="padding-top:0"><div class="section-head"><h3>Continuar leyendo</h3></div><div class="grid">${continuing.map(card).join('')}</div></section>`:''}
 <div class="section-head"><h3>Todas las historias</h3></div>
 <div class="grid">${arr.length?arr.map(card).join(""):'<p style="color:var(--muted)">No encontramos historias con esos filtros.</p>'}</div></main>`}

function detail(id){let s=stories.find(x=>x.id===id);let lib=state.library[id];
 let endingsCount=Object.keys(s.endings).length; let unlocked=lib?lib.endings.length:0;
 return `${nav()}<main class="detail container screen"><div class="detail-top"><div class="large-cover">${renderArt(s.coverArt)}<span>${s.title}</span></div><div><div class="eyebrow">${s.genre} · ${s.age} · ${s.status}</div><h1 style="font-size:60px">${s.title}</h1><p style="color:var(--muted)">Por ${s.author} · ${s.totalChapters} capítulos · ${unlocked}/${endingsCount} finales descubiertos</p><p style="font-size:17px;line-height:1.7;color:#ccc">${s.desc}</p><div>${['Decisiones','Múltiples finales',...s.theme.map(t=>'#'+t)].map(x=>`<span class="badge">${x}</span>`).join("")}</div><div class="actions" style="margin-top:22px"><button class="btn" onclick="startReader(${s.id},true)">${lib&&lib.node?'Reiniciar':'Comenzar'}</button>${lib&&lib.node?`<button class="btn secondary" onclick="startReader(${s.id},false)">Continuar</button>`:''}<button class="btn gold" onclick="toggleFav(${s.id})">${state.favorites.includes(s.id)?'★ Favorito':'☆ Favorito'}</button></div></div></div>
<div class="chapters"><h2>Capítulos</h2>${Array.from({length:s.totalChapters},(_,i)=>`<div class="chapter"><div><b>Capítulo ${i+1}</b><div class="meta">${i===0?'Introducción':'Ruta narrativa '+(i+1)}</div></div><span class="badge ${lib&&lib.node&&s.nodes[lib.node] && s.nodes[lib.node].chapter>=i+1?'green':''}">${lib&&lib.node&&s.nodes[lib.node]&&s.nodes[lib.node].chapter>=i+1?'Visitado':'Por descubrir'}</span></div>`).join("")}</div>
<section class="section"><h2>Finales</h2><div class="endings-grid">${Object.entries(s.endings).map(([k,e])=>`<div class="ending-tile ${lib&&lib.endings.includes(k)?'':'locked'}"><div class="es">${lib&&lib.endings.includes(k)?'✦':'?'}</div><div>${lib&&lib.endings.includes(k)?e.name:'Final oculto'}</div></div>`).join('')}</div></section>
</main>`}

function toggleFav(id){ state.favorites.includes(id)?state.favorites=state.favorites.filter(x=>x!==id):state.favorites.push(id); saveProgress(); render() }

function particles(mood){
 let n = mood==='magia'?14:mood==='peligro'?10:8;
 let color = {noche:'#a99cff',misterio:'#8b8b9a',esperanza:'#55D68A',peligro:'#FF5364',romance:'#E63967',fantasia:'#7B61FF',magia:'#F5C451',neutral:'#A6A6B3'}[mood]||'#A6A6B3';
 let items=Array.from({length:n},(_,i)=>{let l=Math.random()*100,s=4+Math.random()*6,d=6+Math.random()*8,dl=Math.random()*6;
   return `<i style="left:${l}%;width:${s}px;height:${s}px;background:${color};animation-duration:${d}s;animation-delay:-${dl}s"></i>`}).join('');
 return `<div class="particles">${items}</div>`;
}

function startReader(id,restart){
 state.story=id; let lib=libFor(id); let s=stories.find(x=>x.id===id);
 if(restart||!lib.node) lib.node=s.start;
 saveProgress(); go('reader');
}

function reader(){
 let s=stories.find(x=>x.id===state.story); let lib=libFor(s.id);
 let node=s.nodes[lib.node];
 if(node.type==='end') return endingScreen(s,node);
 let pct = Math.min(100, Math.round(node.chapter/s.totalChapters*100));
 let leftDim = node.speaker && node.speaker!==Object.values(s.characters)[0] && node.speaker!=='Narrador' && s.characters.left!==node.speaker.charAt(0);
 return `<main class="reader mood-${node.mood}">${particles(node.mood)}
 <div class="progress"><i style="width:${pct}%"></i></div>
 <div class="reader-controls"><button class="ghost" onclick="go('detail')">← Salir</button><div><button class="ghost" title="Ambiente">${moodIcons[node.mood]||''}</button></div></div>
 <div class="scene-art">${renderArt(node.art)}<div class="character left ${node.speaker==='Narrador'?'dim':''}">${s.characters.left}</div><div class="character right ${node.speaker==='Narrador'?'dim':''}">${s.characters.right}</div></div>
 <div class="dialogue" onclick="advance()"><div class="speaker">${node.speaker}</div><div class="dialogue-text">${node.text}</div><div style="text-align:right;color:var(--muted);font-size:12px">CLICK PARA CONTINUAR ▸</div></div>
 ${node.type==='choice'?`<div class="choices"><div class="choice-box"><div class="eyebrow">DECISIÓN</div><h2>${node.prompt}</h2><p>La elección cambiará tu ruta narrativa.</p>${node.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${c.text}</button>`).join('')}</div></div>`:''}
 </main>`}

function advance(){
 let s=stories.find(x=>x.id===state.story); let lib=libFor(s.id); let node=s.nodes[lib.node];
 if(node.type==='choice') return;
 lib.node=node.next; saveProgress(); render();
}
function choose(i){
 let s=stories.find(x=>x.id===state.story); let lib=libFor(s.id); let node=s.nodes[lib.node];
 let c=node.choices[i]; lib.decisions.push(c.text); lib.node=c.next;
 let next=s.nodes[lib.node];
 if(next.type==='end' && !lib.endings.includes(next.ending)) lib.endings.push(next.ending);
 saveProgress(); render();
}
function endingScreen(s,node){
 let e=s.endings[node.ending]; let lib=state.library[s.id]; let total=Object.keys(s.endings).length;
 return `<main class="end"><div class="end-illustration">${renderArt(node.art)}</div><div class="end-card"><div class="end-symbol">✦</div><div class="eyebrow">FINAL DESBLOQUEADO</div><h1 style="font-size:60px">${e.name}</h1><p style="font-size:18px;color:#ccc;line-height:1.7">${e.text}</p><div class="stats"><div class="stat">Finales de esta historia: <b>${lib.endings.length} / ${total}</b></div><div class="stat">Decisiones tomadas: <b>${lib.decisions.length}</b></div></div><div class="actions" style="justify-content:center"><button class="btn" onclick="startReader(${s.id},true)">Explorar otra ruta</button><button class="btn secondary" onclick="go('library')">Volver a biblioteca</button></div></div></main>`}

function profile(){
 let favStories=state.favorites.map(id=>stories.find(s=>s.id===id)).filter(Boolean);
 let inProgress=Object.keys(state.library).map(id=>stories.find(s=>s.id==id)).filter(Boolean);
 let unlockedTotal=Object.values(state.library).reduce((a,l)=>a+l.endings.length,0);
 return `${nav()}<main class="profile container screen"><div class="profile-head"><div class="avatar">${state.user.name[0].toUpperCase()}</div><div><h2>${state.user.name}</h2><div class="meta">${state.user.email}</div></div></div>
 <section class="section"><div class="eyebrow">TU PROGRESO</div><h2>Mis historias</h2>
 ${inProgress.length?inProgress.map(s=>{let lib=state.library[s.id];let node=s.nodes[lib.node]||{chapter:0};let pct=Math.min(100,Math.round(node.chapter/s.totalChapters*100));return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><b>${s.title}</b><span class="meta">${pct}%</span></div><div class="progressbar"><i style="width:${pct}%"></i></div></div>`}).join(''):'<p class="meta">Aún no has empezado ninguna historia.</p>'}</section>
 <section class="section" style="padding-top:0"><div class="eyebrow">COLECCIÓN</div><h2>Finales descubiertos (${unlockedTotal}/${totalEndingsAll})</h2>
 <div class="endings-grid">${stories.flatMap(s=>Object.entries(s.endings).map(([k,e])=>{let lib=state.library[s.id];let has=lib&&lib.endings.includes(k);return `<div class="ending-tile ${has?'':'locked'}"><div class="es">${has?'✦':'?'}</div><div>${has?e.name:'Final oculto'}</div><div class="meta">${s.title}</div></div>`})).join('')}</div></section>
 ${favStories.length?`<section class="section" style="padding-top:0"><div class="eyebrow">GUARDADAS</div><h2>Favoritas</h2><div class="grid">${favStories.map(card).join('')}</div></section>`:''}
 </main>`}

function openStory(id){if(!state.user){go('login');return}state.story=id;go('detail')}
async function logout(){ await Backend.signOut(); state.user=null; state.favorites=[]; state.library={}; go('home') }
function go(s){state.screen=s;render()}
function render(){
 let x=state.screen;
 document.getElementById('app').innerHTML = state.booting?`<div class="loadscreen"><div class="spinner"></div><div>Cargando KAGE...</div></div>`:
  x==='home'?home():x==='register'?auth('register'):x==='login'?auth('login'):x==='library'?library():x==='detail'?detail(state.story):x==='reader'?reader():x==='profile'?profile():home();
}

/* ================== Arranque ================== */
(async function init(){
 render();
 if(FIREBASE_CONFIGURED){
   try{ await FirebaseBackend.init(); Backend=FirebaseBackend; }
   catch(err){ console.warn('No se pudo iniciar Firebase, usando guardado local.', err); Backend=LocalBackend; }
 }
 await Backend.init();
 try{
   let u = await Backend.currentUser();
   if(u){ state.user=u; let data=await Backend.loadProgress(u.uid); state.favorites=data.favorites||[]; state.library=data.library||{}; state.screen='library'; }
 }catch(err){ console.warn('No había sesión activa.', err); }
 state.booting=false;
 render();
})();
</script>
</body>
</html>
